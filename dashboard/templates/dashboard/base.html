{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="{% static 'embed/theme.css' %}">
<link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>
<body>
<site-nav data-up="{{ request.scheme }}://{{ request.get_host }}"></site-nav>
<main class="page">{% block content %}{% endblock %}</main>
<script src="{% static 'embed/nav.js' %}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
